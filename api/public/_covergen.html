<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#000; }
  .card {
    position:relative; width:800px; height:450px; overflow:hidden;
    background:
      radial-gradient(ellipse 60% 85% at 50% 46%, rgba(160,32,240,0.26), transparent 62%),
      radial-gradient(ellipse 55% 75% at 62% 60%, rgba(0,180,255,0.18), transparent 60%),
      radial-gradient(ellipse 70% 90% at 8% 6%, rgba(24,20,66,0.5), transparent 70%),
      linear-gradient(120deg,#06070f 0%,#0a0c1a 55%,#0d1024 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .card::before{
    content:''; position:absolute; inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(140,170,255,0.13) 1.2px, transparent 0);
    background-size:22px 22px;
    -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000, transparent 78%);
  }
  .card svg { width:360px; height:360px; overflow:visible; position:relative; z-index:2; }
</style>
</head>
<body>
  <div class="card" id="card">
      <svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="coin" cx="38%" cy="32%" r="75%">
            <stop offset="0%" stop-color="#ffe27a"/><stop offset="45%" stop-color="#ffc73a"/><stop offset="100%" stop-color="#e8991b"/>
          </radialGradient>
          <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffd968"/><stop offset="100%" stop-color="#c9800f"/></linearGradient>
          <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00f0ff"/><stop offset="100%" stop-color="#a020f0"/></linearGradient>
          <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#e8991b" flood-opacity="0.45"/></filter>
        </defs>
        <circle cx="190" cy="190" r="168" fill="none" stroke="rgba(120,170,255,0.14)" stroke-width="1.5"/>
        <circle cx="190" cy="190" r="150" fill="none" stroke="rgba(0,240,255,0.12)" stroke-width="1.5" stroke-dasharray="3 9"/>
        <g stroke="url(#acc)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
          <path d="M70 108 V78 H100"/><path d="M310 108 V78 H280"/><path d="M70 272 V302 H100"/><path d="M310 272 V302 H280"/>
        </g>
        <g stroke="url(#acc)" stroke-width="3" stroke-linecap="round" opacity="0.7">
          <path d="M190 40 V60"/><path d="M190 320 V340"/><path d="M40 190 H60"/><path d="M320 190 H340"/>
        </g>
        <ellipse cx="190" cy="210" rx="96" ry="96" fill="#e8991b" opacity="0.35" filter="url(#soft)"/>
        <g filter="url(#glow)">
          <circle cx="190" cy="190" r="92" fill="url(#rim)"/>
          <circle cx="190" cy="190" r="80" fill="url(#coin)"/>
          <circle cx="190" cy="190" r="80" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
          <path d="M190 150 v80 M190 158 c-16 0 -24 8 -24 18 c0 20 48 8 48 28 c0 10 -8 18 -24 18" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <path d="M138 150 a70 70 0 0 1 104 -6 a80 80 0 0 0 -104 6 Z" fill="rgba(255,255,255,0.35)"/>
        <g transform="translate(268 96)">
          <circle cx="0" cy="0" r="34" fill="#0b0d1c"/><circle cx="0" cy="0" r="34" fill="none" stroke="rgba(120,170,255,0.25)" stroke-width="1.5"/>
          <g transform="translate(-19 -19) scale(0.32)" fill="none" stroke="url(#acc)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 15 L25 30 V55 C25 80 50 100 60 105 C70 100 95 80 95 55 V30 Z"/><path d="M40 58 l14 14 l26 -28"/>
          </g>
        </g>
        <g transform="translate(96 286)">
          <circle r="24" fill="url(#rim)"/><circle r="20" fill="url(#coin)"/>
          <path d="M0 -11 v22 M0 -8 c-6 0 -9 3 -9 7 c0 8 18 3 18 11 c0 4 -3 7 -9 7" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <g fill="#ffe27a">
          <path d="M300 250 c1.5 -7 3 -8.5 10 -10 c-7 -1.5 -8.5 -3 -10 -10 c-1.5 7 -3 8.5 -10 10 c7 1.5 8.5 3 10 10 Z"/>
          <path d="M92 132 c1.2 -5.5 2.3 -6.6 7.8 -7.8 c-5.5 -1.2 -6.6 -2.3 -7.8 -7.8 c-1.2 5.5 -2.3 6.6 -7.8 7.8 c5.5 1.2 6.6 2.3 7.8 7.8 Z"/>
        </g>
        <g fill="#8fe9ff"><circle cx="322" cy="196" r="4"/><circle cx="150" cy="322" r="3.5"/></g>
      </svg>
  </div>
</body>
</html>
